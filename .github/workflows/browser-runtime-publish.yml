name: Build & Publish Browser Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile.browser'
      - 'package.json'
      - 'package-lock.json'
      - 'browser-runtime/package.json'
      - 'browser-runtime/package-lock.json'
      - 'tsconfig.json'
      - 'src/browserRuntime.ts'
      - 'src/browserRuntimeApi.ts'
      - 'src/browserFetcher.ts'
      - 'src/cookies.ts'
      - 'src/db.ts'
      - 'src/proxy.ts'
      - 'src/sshTunnel.ts'
      - 'src/totp.ts'
      - 'src/trackerTemplates.ts'
      - 'src/types.ts'
      - 'src/userAgent.ts'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - 'Dockerfile.browser'
      - 'package.json'
      - 'package-lock.json'
      - 'browser-runtime/package.json'
      - 'browser-runtime/package-lock.json'
      - 'tsconfig.json'
      - 'src/browserRuntime.ts'
      - 'src/browserRuntimeApi.ts'
      - 'src/browserFetcher.ts'
      - 'src/cookies.ts'
      - 'src/db.ts'
      - 'src/proxy.ts'
      - 'src/sshTunnel.ts'
      - 'src/totp.ts'
      - 'src/trackerTemplates.ts'
      - 'src/types.ts'
      - 'src/userAgent.ts'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tracker-dashboard/tracker-dashboard-browser

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed')) && 'main' || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_IMAGE_SOURCE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            APP_IMAGE_VERSION=${{ steps.meta.outputs.version }}
            APP_IMAGE_REVISION=${{ github.sha }}
            APP_IMAGE_REF=${{ github.ref_name }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser
