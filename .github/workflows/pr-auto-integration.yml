name: PR Branch Preparation

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    name: Activer la fusion automatique
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Attendre les contrôles requis puis fusionner
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    autoMergeRequest { enabledAt }
                  }
                }
              }
            `;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pull.number,
            });
            const pullRequest = result.repository.pullRequest;

            if (pullRequest.autoMergeRequest) {
              core.info('La fusion automatique est déjà activée.');
              return;
            }

            const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            for (let attempt = 1; attempt <= 60; attempt += 1) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo, pull_number: pull.number,
              });
              if (current.merged) return;
              if (current.state !== 'open' || current.draft || current.head.sha !== pull.head.sha) {
                core.setFailed('PR fermée, repassée en brouillon ou modifiée : fusion interrompue.');
                return;
              }
              try {
                await github.graphql(`
                  mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }
                `, { pullRequestId: pullRequest.id });
                core.info('Fusion automatique activée : GitHub attend les contrôles requis.');
                return;
              } catch (error) {
                // GitHub peut refuser auto-merge en UNSTABLE, y compris après un
                // échec de ce job. Une fusion normale reste soumise aux protections.
                if (!String(error.message).includes('unstable status')) throw error;
                const checks = await github.paginate(github.rest.checks.listForRef, {
                  ...context.repo, ref: current.head.sha, filter: 'latest', per_page: 100,
                });
                const required = ['Node build', 'Docker build and CVE scan', 'Docker build runtime navigateur'];
                const passed = required.every(name => {
                  const matches = checks.filter(check => check.name === name);
                  return matches.length > 0 && matches.every(check =>
                    check.status === 'completed' && check.conclusion === 'success');
                });
                if (passed) {
                  try {
                    const result = await github.rest.pulls.merge({
                      ...context.repo, pull_number: pull.number,
                      sha: current.head.sha, merge_method: 'squash',
                    });
                    if (result.data.merged) {
                      core.info('PR fusionnée après réussite des contrôles, sans contournement des protections.');
                      return;
                    }
                  } catch (mergeError) {
                    if (![405, 409].includes(mergeError.status)) throw mergeError;
                  }
                }
                core.info(`État GitHub instable (${attempt}/60), nouvelle vérification dans 15 s.`);
                await pause(15_000);
              }
            }
            core.setFailed('GitHub refuse toujours la fusion après attente des contrôles.');

  publish-after-auto-merge:
    name: Publier les images après fusion
    needs: enable-auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Attendre la fusion puis déclencher la publication
        uses: actions/github-script@v8
        with:
          script: |
            const number = context.payload.pull_request.number;
            const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

            for (let attempt = 1; attempt <= 80; attempt += 1) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (pull.merged_at) {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'docker-publish.yml',
                  ref: 'main',
                });
                core.info(`PR #${number} fusionnée : publication Docker déclenchée sur main.`);
                return;
              }

              if (pull.state === 'closed') {
                core.info(`PR #${number} fermée sans fusion : aucune publication.`);
                return;
              }

              core.info(`PR #${number} encore ouverte (${attempt}/80), nouvelle vérification dans 15 s.`);
              await pause(15_000);
            }

            core.setFailed(`La PR #${number} n'a pas été fusionnée dans le délai de 20 minutes.`);
