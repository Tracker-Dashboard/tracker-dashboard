name: Build & Publish Docker Image

on:
  schedule:
    # Rebuild hebdo de latest sur la base node:22 a jour (correctifs Node/Debian)
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tracker-dashboard/tracker-dashboard

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'closed')) && 'main' || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild hebdo : ne republier latest que si la base node:22 a change.
      # L'empreinte de la base est inscrite dans l'image (label OCI) puis
      # comparee a la base actuelle. Les autres evenements publient toujours.
      - name: Check base image
        id: base
        env:
          BASE_IMAGE: node:22-bookworm-slim
          PUBLISHED_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          set -euo pipefail
          current="$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{json .Manifest}}' | jq -r '.digest // empty' || true)"
          published="$(docker buildx imagetools inspect "$PUBLISHED_IMAGE" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(if has("config") then . else .["linux/amd64"] end) | .config.Labels["org.opencontainers.image.base.digest"] // empty' || true)"
          echo "digest=$current" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$current" ] && [ -n "$published" ] && [ "$current" = "$published" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Base $BASE_IMAGE inchangee ($current) : latest n'est pas republie." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Base $BASE_IMAGE : ${current:-inconnue} (image publiee : ${published:-sans empreinte})" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/node:22-bookworm-slim
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
          tags: |
            # latest sur push main, relance manuelle ou PR fusionnee. Le dernier cas
            # couvre les fusions automatiques au GITHUB_TOKEN qui ne recreent pas
            # toujours un evenement push exploitable par Actions.
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) }}
            # tag semver si push d'un tag v*
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # sha court pour traçabilité
            type=sha,prefix=sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: steps.base.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          pull: true
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_IMAGE_SOURCE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            APP_IMAGE_VERSION=${{ steps.meta.outputs.version }}
            APP_IMAGE_REVISION=${{ github.sha }}
            APP_IMAGE_REF=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
